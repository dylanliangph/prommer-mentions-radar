name: radar
on:
  schedule:
    - cron: "0 22 * * *"   # 06:00 UTC+8, daily
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 radar.py
      - name: Commit updated radar
        run: |
          git config user.name "radar-bot"
          git config user.email "actions@github.com"
          git add docs/
          git diff --cached --quiet || git commit -m "radar: daily scan"
          git push
